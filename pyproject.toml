[project]
name = "web-content-kit"
version = "0.1.0"
description = "Collect web pages into a Unity Catalog Volume (Genie source) and index them for Vector Search."
readme = "README.md"
requires-python = ">=3.11"
# Core: the page format and chunking, used by the step 2 pipeline.
dependencies = ["langchain-text-splitters>=0.3"]

[project.optional-dependencies]
# Step 1: crawl websites and save clean Markdown pages.
crawl = ["requests>=2.31", "trafilatura>=2.0"]
# Step 2 notebook: manage the pipeline and Vector Search index.
index = ["databricks-sdk>=0.60"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "web-content-kit[crawl,index]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_content_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Databricks provides dbutils, spark, display and displayHTML in notebooks and pipelines.
"notebooks/*" = ["F821"]
